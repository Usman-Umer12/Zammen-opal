<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Settings -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1a19" />

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/p1.webp" />
    <link rel="apple-touch-icon" href="/p1.webp" />

    <!-- Primary SEO -->
    <title>
      Zameen Opal | Furnished Apartments & Short-Term Stays in Pakistan
    </title>

    <meta
      name="description"
      content="Book comfortable and fully furnished apartments for short-term stays in Lahore, Murree and Islamabad. Enjoy privacy, comfort and direct booking with Zameen Opal and Glory Stays."
    />

    <meta
      name="keywords"
      content="furnished apartments Lahore, short term stays Pakistan, apartments in Murree, apartments in Islamabad, holiday apartments Pakistan, Zameen Opal, Glory Stays, furnished accommodation Lahore"
    />

    <meta name="author" content="Zameen Opal" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <!-- Replace with your official live domain -->
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:title"
      content="Zameen Opal | Furnished Apartments & Short-Term Stays"
    />

    <meta
      property="og:description"
      content="Comfortable and fully furnished apartments in Lahore, Murree and Islamabad. Book your short-term stay directly with Zameen Opal."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/p1.webp" />
    <meta property="og:image:alt" content="Zameen Opal furnished apartment" />
    <meta property="og:site_name" content="Zameen Opal | Glory Stays" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Zameen Opal | Furnished Apartments & Short-Term Stays"
    />

    <meta
      name="twitter:description"
      content="Book comfortable and fully furnished apartments in Lahore, Murree and Islamabad."
    />

    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/p1.webp"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data / Schema.org -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LodgingBusiness",
        "name": "Zameen Opal",
        "alternateName": "Glory Stays",
        "description": "Furnished apartments and short-term stays in Lahore, Murree and Islamabad, Pakistan.",
        "image": "https://YOUR-DOMAIN.com/p1.webp",
        "telephone": "+92 328 2626261",
        "email": "info@glorystays.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Plots 16 & 17, Sector A, Land Breeze Housing Society, Main Raiwind Road",
          "addressLocality": "Lahore",
          "addressRegion": "Punjab",
          "addressCountry": "PK"
        },
        "areaServed": [
          {
            "@type": "City",
            "name": "Lahore"
          },
          {
            "@type": "City",
            "name": "Murree"
          },
          {
            "@type": "City",
            "name": "Islamabad"
          }
        ],
        "url": "https://YOUR-DOMAIN.com/"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
